name: Deploy client documents to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # client/ holds the documents shared with The Dog Club (quotation, invoice, audit, onboarding, progress).
      # The website itself is built in its own repository.
      - name: Select published pages
        run: |
          cp -r client _site
          echo '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=progress/"><title>The Dog Club</title><a href="progress/">The Dog Club project progress</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
