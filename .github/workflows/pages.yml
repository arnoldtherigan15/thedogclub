name: Deploy mockup to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["mockup/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python3 mockup/build.py
      - uses: actions/configure-pages@v5
      # Only publish client-facing pages. The full 27-page mockup stays in the repo but is hidden
      # until the design is approved: to publish it again, set "path: mockup" below.
      - name: Select published pages
        run: |
          mkdir _site
          cp -r mockup/design mockup/quotation mockup/invoice mockup/seo-audit mockup/onboarding mockup/assets _site/
          rm _site/design/build_design.py
          echo '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=design/"><title>The Dog Club</title><a href="design/">The Dog Club design samples</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
